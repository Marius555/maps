name: Playwright Tests

# Manual only. The e2e suite runs against a real Appwrite project as a real test
# account, and CI has neither. To run it on every push, add these repository
# secrets, write them to .env in a step before "Run Playwright tests", and
# change `on:` back to push/pull_request:
#   NEXT_PUBLIC_APPWRITE_ENDPOINT, NEXT_PUBLIC_APPWRITE_PROJECT_ID,
#   NEXT_PUBLIC_APPWRITE_PROJECT_NAME, APPWRITE_API_KEY, DATABASE_ID, STORAGE_ID,
#   E2E_EMAIL, E2E_PASSWORD, and DISABLE_ALL_PLAN=true (or a Pro test account).
on:
  workflow_dispatch:

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Build the embed
        run: npm run build:embed
      - name: Run Playwright tests
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
