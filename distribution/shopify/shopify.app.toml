# The Pinglide Shopify app (docs/notes/shopify.md).
#
# The app itself is the Next.js site at the repo root — the admin pages, the App
# Home (app/shopify/route.ts) and the webhooks all run there, on Appwrite Sites.
# This folder holds only what Shopify keeps: this configuration and the theme
# app extension. `npm run shopify:deploy` pushes both; once deployed, Shopify's
# copy is what merchants get.
#
# This is the development app (the one `shopify app dev` installs on the dev
# store). The production app gets its own `shopify.app.production.toml` when it
# is created for the App Store submission.

client_id = "9f5f7dafc4c98c5b372c8087f8d4b29d"
name = "pinglide"
# The site's root. proxy.ts sends `/?shop=…` to the App Home (/shopify), so
# the landing page stays static for everybody else. `shopify app dev` swaps
# this for its tunnel while it runs.
application_url = "https://pinglide.com/"
embedded = true

[build]
automatically_update_urls_on_dev = true
include_config_on_deploy = true

[access_scopes]
# Shopify managed installation: required scopes are granted before the app
# first loads, so the first load is the install (lib/shopify/install.ts). None
# are required — the storefront block needs only the app's own metafield and
# metaobjects, which need no scope. Ask for the least: requesting what the app
# does not use fails App Store review.
scopes = ""
# Asked for only when a merchant presses the button that needs one, in
# Shopify's own dialog (App Bridge Scopes API, lib/shopify/app-bridge-scopes.ts):
# read_locations for "Import from Shopify" in the import wizard.
optional_scopes = ["read_locations"]

[auth]
redirect_urls = ["https://pinglide.com/shopify"]

# One entry per map on the storefront, written by "Show on storefront"
# (app/api/maps/[id]/shopify-storefront). The theme block's "Map" setting is a
# picker of these, so a merchant chooses a map by name instead of typing a code.
# App-owned (`$app:map`), which needs no access scope. The field keys are the
# block's contract (docs/notes/shopify.md, "Storefront").
[metaobjects.app.map]
name = "Pinglide map"
display_name_field = "name"
access.admin = "merchant_read"
access.storefront = "public_read"

[metaobjects.app.map.fields.name]
name = "Name"
type = "single_line_text_field"
required = true

[metaobjects.app.map.fields.snapshot]
name = "Snapshot URL"
type = "single_line_text_field"
required = true

[webhooks]
api_version = "2026-10"

  # Relative to application_url, so `shopify app dev` points them at its tunnel.
  [[webhooks.subscriptions]]
  topics = ["app/uninstalled"]
  uri = "/api/webhooks/shopify"

  # The three every App Store app must answer.
  [[webhooks.subscriptions]]
  compliance_topics = ["customers/data_request", "customers/redact", "shop/redact"]
  uri = "/api/webhooks/shopify"

[pos]
embedded = false
